<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>Monaco Viewer</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 16px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                font-size: 13px;
                line-height: 1.6;
                background: #ffffff;
                color: #24292e;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background: #1e1e1e;
                    color: #e0e0e0;
                }
            }
        </style>
        <script src="sidepanel.js"></script>
    </head>

    <body>
        hello world
    </body>
</html>
